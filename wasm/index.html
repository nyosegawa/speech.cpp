<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speech.cpp in the browser</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; --error: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #a1a1a6; --line: #3a3a3c; --error: #ff8a80; } }
  body { margin: 0 auto; max-width: 40rem; padding: 1.5rem 1rem; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  form { display: grid; gap: 0.75rem; margin-bottom: 1.5rem; }
  label { display: grid; gap: 0.25rem; font-weight: 600; }
  input[type=text] { font: inherit; padding: 0.4rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { justify-self: start; font: inherit; padding: 0.45rem 1.2rem; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  #error { color: var(--error); white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; margin: 0 0 1rem; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 0.2rem 0.8rem; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<h1>speech.cpp in the browser</h1>
<p id="version">Finds where someone speaks in a WAVE file with Silero VAD, inside this page; nothing is sent anywhere.</p>
<form id="form">
  <label>Model (GGUF) <input id="model" type="file" accept=".gguf"></label>
  <label>Audio (WAVE) <input id="audio" type="file" accept=".wav,audio/wav"></label>
  <label>Request options (JSON) <input id="options" type="text" placeholder='{"threshold": 0.5}' spellcheck="false"></label>
  <button id="detect" type="submit">Detect speech</button>
  <span id="status" role="status"></span>
  <div id="error" role="alert" hidden></div>
</form>
<section id="result" hidden>
  <dl id="stats"></dl>
  <table>
    <thead><tr><th>Region</th><th>Start</th><th>End</th></tr></thead>
    <tbody id="regions"></tbody>
  </table>
</section>
<script type="module" src="page.mjs"></script>
</body>
</html>
