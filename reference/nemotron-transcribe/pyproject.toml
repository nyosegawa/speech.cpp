[project]
name = "speech-cpp-nemotron-transcribe-reference"
version = "0"
description = "Runs NVIDIA Nemotron 3.5 Transcribe's official modules on the CPU in float32 to dump reference tensors, and converts its weights to GGUF"
requires-python = ">=3.12,<3.13"
dependencies = [
  # NeMo Speech's main branch, which the model card names; nemo-toolkit 3.0.0 has neither SALMAutomodel's
  # ParallelExpertEncoder nor the nemotron3p5 prompt format.
  "nemo-toolkit[asr,speechlm2-only] @ git+https://github.com/NVIDIA-NeMo/Speech.git@040574f7ffa3bb0ae4b92aa8424ecea454d03c91",
  # The commit and the transformers NeMo Speech's uv.lock pins at the commit above.
  "nemo-automodel @ git+https://github.com/NVIDIA-NeMo/Automodel.git@309a10098e3ea3d9b79d4b96fa397db40908b751",
  "transformers==5.18.0",
  "torch==2.11.0",
  "numpy",
  "safetensors",
  "soundfile",
  "huggingface_hub",
  "gguf",
]

[tool.uv]
package = false
# The dumps run on Modal's Linux CPUs, which hold the model in float32; the conversion runs on macOS.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
megatron-fsdp = { git = "https://github.com/yuhezhang-ai/Megatron-LM.git", rev = "455389c480af6b3acdca74c7830c68b3274eb083", subdirectory = "megatron/core/distributed/fsdp/src" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# NeMo Speech's own pyproject.toml declares the same, so that the Automodel commit's metadata does not bring its torch
# from the CUDA index on Linux; megatron-fsdp is the commit NeMo Speech's sources name.
[[tool.uv.dependency-metadata]]
name = "nemo-automodel"
version = "0.8.0+309a10098"
requires-python = ">=3.10"
requires-dist = [
    "datasets>=4.0.0",
    "megatron-fsdp==0.5.0",
    "mistral-common[audio,hf-hub,sentencepiece]",
    "ninja",
    "pyyaml",
    "tiktoken",
    "torch>=2.6.0",
    "torchdata",
    "transformers==5.18.0",
    "torchao>=0.16.0",
    "flashoptim>=0.1.3",
    "quack-kernels==0.6.4; sys_platform == 'linux'",
]
