name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Each platform's job builds speech, the one executable, and libspeech, and packs them with speech.h into the archive
# a release publishes, speech-<VERSION>-<platform>.zip, on every run: a pull request shows the archive a tag would
# release, and the release job publishes the same files. The checks are built to keep them compiling, and released in
# no archive.
jobs:
  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF
          cmake --build build --config Release -j 4
      # The shared library goes in under the name its install name gives, libspeech.<major>.dylib, with the link
      # libspeech.dylib that a program links against; zip -y keeps the link.
      - name: Package
        run: |
          archive="speech-$(cat VERSION)-macos-arm64-metal.zip"
          mkdir package
          cp build/speech build/libspeech.*.dylib include/speech.h package/
          (cd package && ln -s libspeech.*.dylib libspeech.dylib && zip -qy "../$archive" *)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      # The archive as a user unpacks it: speech runs with the library linked in, the link names the versioned
      # library, and libspeech exports the C API alone.
      - name: Check the archive
        run: |
          mkdir unpacked
          cd unpacked
          unzip -q "../$ARCHIVE"
          ls -l
          ./speech --version
          test "$(readlink libspeech.dylib)" = "$(ls libspeech.*.dylib)"
          if otool -L speech | grep -q libspeech; then
            echo "::error::speech needs libspeech; it links the library statically."
            exit 1
          fi
          exported=$(nm -gU libspeech.*.dylib | awk '{print $3}' | grep -v '^_speech_' || true)
          if [ -n "$exported" ]; then
            echo "::error::libspeech exports symbols outside the C API: $(echo $exported)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: speech-macos-arm64-metal
          path: ${{ env.ARCHIVE }}

  windows-vulkan:
    runs-on: windows-2025
    env:
      VULKAN_VERSION: 1.4.357.0
      # ggml is built once, installed with static libraries, and restored from the cache while its commit,
      # the Vulkan SDK, Visual Studio and these options stay the same: compiling Vulkan's shaders alone takes
      # over two minutes, which the project's own code does not need repeated. The key names Visual Studio's
      # version rather than the runner image's, since consecutive runs land on different image versions.
      CMAKE_OPTIONS: -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      GGML_OPTIONS: -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF
    steps:
      - uses: actions/checkout@v6
      - name: Name the ggml build
        id: ggml
        run: |
          $commit = (git ls-tree HEAD ggml).Split()[2]
          $bytes = [Text.Encoding]::UTF8.GetBytes("$env:CMAKE_OPTIONS $env:GGML_OPTIONS")
          $options = (Get-FileHash -InputStream ([IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.Substring(0, 12)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          Add-Content $env:GITHUB_OUTPUT "key=ggml-$commit-vulkan-$env:VULKAN_VERSION-vs$vs-$options"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ggml-install
          key: ${{ steps.ggml.outputs.key }}
      - name: Install the Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - name: Build ggml
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 ggml
          $options = "$env:CMAKE_OPTIONS $env:GGML_OPTIONS" -split ' '
          cmake -S ggml -B ggml-build @options "-DCMAKE_INSTALL_PREFIX=$PWD/ggml-install"
          cmake --build ggml-build --config Release -j 4
          cmake --install ggml-build --config Release
      - name: Build
        run: |
          $options = $env:CMAKE_OPTIONS -split ' '
          cmake -B build @options -DSPEECH_INSTALLED_GGML=ON "-DCMAKE_PREFIX_PATH=$PWD/ggml-install"
          cmake --build build --config Release -j 4
      # speech.lib is the import library a program links to use speech.dll.
      - name: Package
        run: |
          $archive = "speech-$((Get-Content VERSION -TotalCount 1).Trim())-windows-x64-vulkan.zip"
          New-Item -ItemType Directory package
          Copy-Item build/Release/speech.exe, build/Release/speech.dll, build/Release/speech.lib, include/speech.h package/
          Compress-Archive -Path package/* -DestinationPath $archive
          Add-Content $env:GITHUB_ENV "ARCHIVE=$archive"
      - name: Check the archive
        run: |
          Expand-Archive $env:ARCHIVE unpacked
          $names = (Get-ChildItem unpacked).Name | Sort-Object
          Get-ChildItem unpacked
          if (Compare-Object $names @('speech.dll', 'speech.exe', 'speech.h', 'speech.lib')) {
            Write-Output "::error::The archive holds $names, not speech.exe, speech.dll, speech.lib and speech.h."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: speech-windows-x64-vulkan
          path: ${{ env.ARCHIVE }}

  # Linux x64 twice: with Vulkan, for a GPU of any vendor, and for the CPU alone, which needs no Vulkan loader
  # to start. The binaries are built on the oldest Ubuntu GitHub hosts and run on glibc 2.34 or later
  # (docs/adr/0010).
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        backend: [vulkan, cpu]
    env:
      BACKEND: ${{ matrix.backend }}
      VULKAN_VERSION: 1.4.357.0
      VULKAN_SHA256: 0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d
      # The oldest glibc the binaries run on; the check below fails a build that needs a newer one.
      GLIBC_FLOOR: '2.34'
      # As on Windows, ggml is built once, installed with static libraries, and restored from the cache while
      # its commit, the runner's Ubuntu, the Vulkan SDK, GCC and these options stay the same. libspeech.so
      # links ggml's static libraries, so they are position-independent, and OpenMP is off so that nothing
      # needs libgomp.
      CMAKE_OPTIONS: -DCMAKE_BUILD_TYPE=Release
      GGML_OPTIONS: -DGGML_VULKAN=${{ matrix.backend == 'vulkan' && 'ON' || 'OFF' }} -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF
    steps:
      - uses: actions/checkout@v6
      - name: Name the ggml build
        id: ggml
        run: |
          commit=$(git ls-tree HEAD ggml | awk '{print $3}')
          options=$(printf '%s' "$CMAKE_OPTIONS $GGML_OPTIONS" | sha256sum | cut -c1-12)
          sdk=
          if [ "$BACKEND" = vulkan ]; then sdk="-$VULKAN_VERSION"; fi
          echo "key=ggml-$commit-$ImageOS-$BACKEND$sdk-gcc$(gcc -dumpfullversion)-$options" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ggml-install
          key: ${{ steps.ggml.outputs.key }}
      # The SDK keeps its Vulkan loader in lib/VulkanLoader, where CMake's FindVulkan looks only through the
      # prefix path.
      - name: Install the Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vulkansdk.tar.xz" "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_VERSION.tar.xz"
          echo "$VULKAN_SHA256  $RUNNER_TEMP/vulkansdk.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/$VULKAN_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk/lib/VulkanLoader" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Build ggml
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 ggml
          cmake -S ggml -B ggml-build $CMAKE_OPTIONS $GGML_OPTIONS "-DCMAKE_INSTALL_PREFIX=$PWD/ggml-install"
          cmake --build ggml-build -j "$(nproc)"
          cmake --install ggml-build
      - name: Build
        run: |
          cmake -B build $CMAKE_OPTIONS -DSPEECH_INSTALLED_GGML=ON "-DCMAKE_PREFIX_PATH=$PWD/ggml-install"
          cmake --build build -j "$(nproc)"
      # libspeech.so exports the C API alone (src/speech.map). Both files need no glibc newer than the floor and
      # no shared library but glibc's and, in the Vulkan build, the Vulkan loader.
      - name: Check the exports and the libraries needed
        run: |
          status=0
          exported=$(nm -D --defined-only build/libspeech.so | awk '{print $3}' | grep -v '^speech_' || true)
          if [ -n "$exported" ]; then
            echo "::error::libspeech.so exports symbols outside the C API: $(echo $exported). Hide them through src/speech.map."
            status=1
          fi
          allowed='libc.so.6 libm.so.6 ld-linux-x86-64.so.2'
          if [ "$BACKEND" = vulkan ]; then allowed="$allowed libvulkan.so.1"; fi
          for file in speech libspeech.so; do
            newest=$(objdump -T "build/$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            if [ "$(printf '%s\n' "$newest" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
              echo "::error::$file needs glibc $newest, newer than the $GLIBC_FLOOR it must run on. Find the call that needs it with objdump -T."
              status=1
            fi
            for library in $(readelf -d "build/$file" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              case " $allowed " in
                *" $library "*) ;;
                *) echo "::error::$file needs $library, which a Linux release does not carry. Link it statically or turn it off."; status=1 ;;
              esac
            done
            echo "$file: glibc $newest, $(readelf -d "build/$file" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ')"
          done
          exit $status
      # The shared library goes in under its SONAME, libspeech.so.<major>, with the link libspeech.so that a program
      # links against; zip -y keeps the link.
      - name: Package
        run: |
          archive="speech-$(cat VERSION)-linux-x64-$BACKEND.zip"
          mkdir package
          cp build/speech build/libspeech.so.* include/speech.h package/
          (cd package && ln -s libspeech.so.* libspeech.so && zip -qy "../$archive" *)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      # The archive as a user unpacks it. The CPU build, which needs no Vulkan loader, also runs speech.
      - name: Check the archive
        run: |
          mkdir unpacked
          cd unpacked
          unzip -q "../$ARCHIVE"
          ls -l
          test -x speech
          test "$(readlink libspeech.so)" = "$(ls libspeech.so.*)"
          if [ "$BACKEND" = cpu ]; then
            ./speech --version
            ./speech devices
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: speech-linux-x64-${{ matrix.backend }}
          path: ${{ env.ARCHIVE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-metal, windows-vulkan, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # VERSION is the release's number; a tag that says otherwise would publish binaries whose
      # speech_version() and ready message name another release.
      - name: Check the tag against VERSION
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match VERSION, which says $version. Tag the commit v$version, or raise VERSION in a pull request and tag that."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sum the archives
        run: |
          cd dist
          ls -l
          sha256sum speech-*.zip > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "speech, speech.cpp's one executable (tts, asr, voice, info, devices, serve and worker), and the shared library libspeech with its C API, speech.h, in one archive for each of macOS arm64 (Metal), Windows x64 (Vulkan) and Linux x64 (Vulkan, and the CPU alone; glibc 2.34 or later). The README lists the model families and where their converted weights are on Hugging Face."
